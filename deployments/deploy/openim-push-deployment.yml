apiVersion: apps/v1
kind: Deployment
metadata:
  name: push-rpc-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: push-rpc-server
  template:
    metadata:
      labels:
        app: push-rpc-server
    spec:
      containers:
        - name: push-rpc-server-container
          image: openim/openim-push:v3.8.3
          env:
            - name: CONFIG_PATH
              value: "/config"
            - name: IMENV_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openim-redis-secret
                  key: redis-password
            - name: IMENV_KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: openim-kafka-secret
                  key: kafka-password
            # Optional Platform resolver wiring. To enable server-managed
            # preferences, create ConfigMap openim-platform-notification with
            # base-url and failure-mode keys, and a Secret of the same name
            # with service-token. The Platform base URL must be the deployed
            # service origin; OpenIM appends its documented resolver path.
            - name: IMENV_OPENIM_PUSH_NOTIFICATIONPREFERENCES_BASEURL
              valueFrom:
                configMapKeyRef:
                  name: openim-platform-notification
                  key: base-url
                  optional: true
            - name: IMENV_OPENIM_PUSH_NOTIFICATIONPREFERENCES_FAILUREMODE
              valueFrom:
                configMapKeyRef:
                  name: openim-platform-notification
                  key: failure-mode
                  optional: true
            - name: IMENV_OPENIM_PUSH_NOTIFICATIONPREFERENCES_SERVICETOKEN
              valueFrom:
                secretKeyRef:
                  name: openim-platform-notification
                  key: service-token
                  optional: true
          volumeMounts:
            - name: openim-config
              mountPath: "/config"
              readOnly: true
          ports:
            - containerPort: 10170
            - containerPort: 12170
      volumes:
        - name: openim-config
          configMap:
            name: openim-config
